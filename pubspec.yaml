name: love_ring
description: "LoveRing - Instant partner pinging app with silent-mode bypass and home screen widget."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0
  app_links: ^6.3.3
  share_plus: ^10.1.4
  http: ^1.3.0
  audioplayers: ^6.1.1
  vibration: ^2.0.1
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
